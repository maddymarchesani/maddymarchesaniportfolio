  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; overflow-x: hidden; }
    body { background: #f8f3f1; color: #8b2e44; font-family: Arial, Helvetica, sans-serif; }
    .portfolio { position: relative; width: 100%; max-width: 1366px; margin-inline: auto; }
    .artwork { display: block; width: 100%; height: auto; }
    .back { position: fixed; z-index: 100; top: 10px; left: 15px; color: #8b2e44; font: 34px/1 Arial,sans-serif; text-decoration: none; padding: 4px; }
    .back:focus-visible, .nav:focus-visible { outline: 2px solid #8b2e44; outline-offset: 2px; }
    .carousel { position: absolute; top: 5.6%; left: 4.2%; width: 91.6%; height: 12.3%; display: flex; align-items: center; gap: 5px; }
    .track { display: flex; align-items: center; gap: 8px; width: 100%; height: 100%; margin: 0; padding: 0; list-style: none; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .track::-webkit-scrollbar { display: none; }
    .slide { flex: 0 0 calc((100% - 16px) / 3); aspect-ratio: 1; max-height: 100%; min-width: 0; overflow: hidden; scroll-snap-align: start; background: #ede3e0; }
    .slide img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .nav { flex: 0 0 26px; width: 26px; padding: 0; border: 0; background: transparent; color: #8b2e44; font: 32px/1 Georgia,serif; cursor: pointer; }
    @media (max-width: 700px) {
      .slide { flex-basis: calc((100% - 8px) / 2); }
      .nav { flex-basis: 20px; width: 20px; font-size: 25px; }
      .back { top: 8px; left: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } }
  </style>

  <script>
    const track = document.getElementById('track');
    function advance(direction) {
      const item = track.querySelector('.slide');
      if (!item) return;
      const gap = parseFloat(getComputedStyle(track).gap) || 0;
      const step = item.getBoundingClientRect().width + gap;
      track.scrollBy({left: direction * step, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    }
    document.getElementById('prev').addEventListener('click', () => advance(-1));
    document.getElementById('next').addEventListener('click', () => advance(1));
  </script>
