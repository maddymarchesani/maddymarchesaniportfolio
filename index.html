<!DOCTYPE html>

<html lang="en-AU" translate="no">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#8b2e44" name="theme-color"/>
<meta content="Maddy Marchesani — Creative Director &amp; Designer. Explore my creative portfolio." name="description"/>
<title>Maddy Marchesani | Creative Portfolio</title>
<style>
    :root { --burgundy:#8b2e44; --cream:#f8f3f1; }
    *, *::before, *::after {box-sizing:border-box}
    html,body {min-height:100%;margin:0}
    body {background:var(--burgundy);color:var(--cream);font-family:Arial,Helvetica,sans-serif}
    main {min-height:100svh;display:grid;place-items:center;overflow:hidden}
    .artboard {position:relative;width:min(100vw,177.8646svh);aspect-ratio:1024.5 / 576;background:var(--burgundy) url('./homepage.webp') center/100% 100% no-repeat}
    /* The source artwork includes static 'CONTENTS >' text. Cover only that area
       and replace it with a real, accessible HTML link. */
    .contents-cover {position:absolute;left:41.7%;top:85.5%;width:17%;height:6.1%;background:var(--burgundy)}
    .contents-link {position:absolute;left:50%;top:88.35%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:1.45em;padding:0.75em 1em;color:var(--cream);font-size:clamp(10px,1.55vw,22px);font-weight:400;letter-spacing:.065em;line-height:1;text-decoration:none;white-space:nowrap;transition:color 220ms ease}
    .contents-link .arrow {display:block;font-weight:200;font-size:1.28em;line-height:.65;transition:transform 220ms ease; transform:translateY(-.03em)}
    .contents-link:hover,.contents-link:focus-visible {color:#fff}
    .contents-link:hover .arrow,.contents-link:focus-visible .arrow {transform:translate(.23em,-.03em)}
    .contents-link:focus-visible {outline:1px solid var(--cream);outline-offset:5px;border-radius:2px}
    @media (prefers-reduced-motion:reduce){.contents-link,.contents-link .arrow{transition:none}}
    @media (max-aspect-ratio: 3/4){.artboard{width:100vw}.contents-link{font-size:clamp(9px,2vw,15px)}}
  </style>
<style>
/* 2026 refinement: full-width, native-artwork, consistent navigation */
html,body{width:100%;max-width:100%;margin:0;overflow-x:hidden}
main{width:100%!important;max-width:none!important;min-height:0!important;display:block!important;overflow:visible!important;margin:0 auto!important}
.artboard{width:100%!important;max-width:none!important;margin:0 auto!important;background-repeat:no-repeat!important}
.back,.back:link,.back:visited{position:fixed!important;top:clamp(12px,2vw,28px)!important;left:clamp(12px,2.2vw,30px)!important;bottom:auto!important;right:auto!important;z-index:999!important;display:inline-flex!important;align-items:center!important;gap:9px!important;padding:10px 14px!important;border:1px solid rgba(255,255,255,.32)!important;border-radius:2px!important;background:rgba(110,37,56,.82)!important;color:#fff!important;box-shadow:none!important;backdrop-filter:blur(8px);font:500 12px/1.2 Arial,Helvetica,sans-serif!important;letter-spacing:.14em!important;text-transform:uppercase!important;text-decoration:none!important;transform:none!important;transition:background-color .2s ease,color .2s ease!important}
.back .arrow,.back .arr{font:400 23px/14px Arial,Helvetica,sans-serif!important;display:inline-block!important;transition:transform .2s ease!important}
.back:hover,.back:focus-visible{background:rgba(139,46,68,.98)!important;color:#ffe2e8!important}
.back:hover .arrow,.back:hover .arr,.back:focus-visible .arrow,.back:focus-visible .arr{transform:translateX(-3px)!important}
.back:focus-visible{outline:2px solid currentColor!important;outline-offset:3px!important}
@media(max-width:600px){.back{padding:8px 10px!important;font-size:10px!important;gap:6px!important}}
@media(prefers-reduced-motion:reduce){.back,.back .arrow,.back .arr{transition:none!important}}
</style><style>
/* Consistent compact navigation above the page artwork */
a.back,a.back:link,a.back:visited{position:fixed!important;top:12px!important;left:14px!important;bottom:auto!important;right:auto!important;z-index:9999!important;display:flex!important;align-items:center!important;justify-content:center!important;width:36px!important;height:36px!important;padding:0!important;margin:0!important;gap:0!important;border:0!important;border-radius:50%!important;box-shadow:none!important;background:rgba(255,251,247,.88)!important;color:#892e44!important;text-decoration:none!important;backdrop-filter:blur(6px);transition:color .2s ease,transform .2s ease,background-color .2s ease!important}
a.back .arrow,a.back .arr{font:400 25px/1 Arial,Helvetica,sans-serif!important;display:block!important;transition:transform .2s ease!important}
a.back:hover,a.back:focus-visible{color:#c1768d!important;background:#fff!important}
a.back:hover .arrow,a.back:hover .arr,a.back:focus-visible .arrow,a.back:focus-visible .arr{transform:translateX(-3px)!important}
a.back:focus-visible{outline:2px solid #892e44!important;outline-offset:3px!important}
@media(max-width:600px){a.back{top:8px!important;left:8px!important;width:32px!important;height:32px!important}}
</style><style>.contents-link span:first-child{display:inline-block;transition:color .25s ease,transform .25s ease,opacity .25s ease!important}.contents-link:hover span:first-child,.contents-link:focus-visible span:first-child{color:#f8d5de!important;transform:translateX(-4px)!important;opacity:.85!important}</style><style>
/* Exact native SVG artwork; no raster downsampling */
.artboard{width:100%!important;max-width:none!important;background-image:url("art-index.svg")!important;background-position:top center!important;background-size:100% 100%!important;background-repeat:no-repeat!important}
</style><meta content="notranslate" name="google"/><style id="fix-bottom-line">.artboard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#8b2e44;pointer-events:none;z-index:1}.contents-link{z-index:2}</style></head>
<body>
<main>
<div aria-label="Creative Portfolio — Maddy Marchesani, Creative Director and Designer" class="artboard" role="img">
<div aria-hidden="true" class="contents-cover"></div>
<a aria-label="View portfolio contents" class="contents-link" href="contents.html">
<span>CONTENTS</span><span aria-hidden="true" class="arrow">›</span>
</a>
</div>
</main>
</body>
</html>
