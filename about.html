<!DOCTYPE html>

<html lang="en-AU" translate="no">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#8b2e44" name="theme-color"/>
<meta content="About Maddy Marchesani — Creative Director and Designer." name="description"/>
<title>About Me | Maddy Marchesani</title>
<style>
:root{--wine:#8b2e44;--cream:#f8f3f1}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--wine);color:var(--cream);font-family:Arial,Helvetica,sans-serif}
main{min-height:100svh;display:grid;place-items:center;overflow:hidden}
.artboard{position:relative;width:min(100vw,171.39svh);aspect-ratio:1024.5 / 597.75;background:var(--wine) url('./about-original.svg') center/100% 100% no-repeat}
.back{position:absolute;left:4.6%;bottom:3.2%;display:inline-flex;align-items:center;gap:.5em;padding:.45em .65em;color:var(--cream);font-size:clamp(9px,1.05vw,14px);font-weight:400;letter-spacing:.1em;text-decoration:none;transition:color .22s ease}
.back .arrow{font-size:1.55em;line-height:.7;transition:transform .22s ease}
.back:hover,.back:focus-visible{color:#fff}
.back:hover .arrow,.back:focus-visible .arrow{transform:translateX(-.22em)}
.back:focus-visible{outline:1px solid currentColor;outline-offset:4px}
@media(max-width:600px){.back{font-size:clamp(7px,1.1vw,10px)}}
@media(prefers-reduced-motion:reduce){.back,.back .arrow{transition:none}}
</style>
<style>
/* 2026 refinement: full-width, native-artwork, consistent navigation */
html,body{width:100%;max-width:100%;margin:0;overflow-x:hidden}
main{width:100%!important;max-width:none!important;min-height:0!important;display:block!important;overflow:visible!important;margin:0 auto!important}
.artboard{width:100%!important;max-width:none!important;margin:0 auto!important;background-repeat:no-repeat!important}
.back,.back:link,.back:visited{position:fixed!important;top:clamp(12px,2vw,28px)!important;left:clamp(12px,2.2vw,30px)!important;bottom:auto!important;right:auto!important;z-index:999!important;display:inline-flex!important;align-items:center!important;gap:9px!important;padding:10px 14px!important;border:1px solid rgba(255,255,255,.32)!important;border-radius:2px!important;background:rgba(110,37,56,.82)!important;color:#fff!important;box-shadow:none!important;backdrop-filter:blur(8px);font:500 12px/1.2 Arial,Helvetica,sans-serif!important;letter-spacing:.14em!important;text-transform:uppercase!important;text-decoration:none!important;transform:none!important;transition:background-color .2s ease,color .2s ease!important}
.back .arrow,.back .arr{font:400 23px/14px Arial,Helvetica,sans-serif!important;display:inline-block!important;transition:transform .2s ease!important}
.back:hover,.back:focus-visible{background:rgba(139,46,68,.98)!important;color:#ffe2e8!important}
.back:hover .arrow,.back:hover .arr,.back:focus-visible .arrow,.back:focus-visible .arr{transform:translateX(-3px)!important}
.back:focus-visible{outline:2px solid currentColor!important;outline-offset:3px!important}
@media(max-width:600px){.back{padding:8px 10px!important;font-size:10px!important;gap:6px!important}}
@media(prefers-reduced-motion:reduce){.back,.back .arrow,.back .arr{transition:none!important}}
</style><style>.artboard{background-size:100.22% 100%!important;background-position:left top!important;background-color:#8b2e44!important}</style><style>
/* Consistent compact navigation above the page artwork */
a.back,a.back:link,a.back:visited{position:fixed!important;top:12px!important;left:14px!important;bottom:auto!important;right:auto!important;z-index:9999!important;display:flex!important;align-items:center!important;justify-content:center!important;width:36px!important;height:36px!important;padding:0!important;margin:0!important;gap:0!important;border:0!important;border-radius:50%!important;box-shadow:none!important;background:rgba(255,251,247,.88)!important;color:#892e44!important;text-decoration:none!important;backdrop-filter:blur(6px);transition:color .2s ease,transform .2s ease,background-color .2s ease!important}
a.back .arrow,a.back .arr{font:400 25px/1 Arial,Helvetica,sans-serif!important;display:block!important;transition:transform .2s ease!important}
a.back:hover,a.back:focus-visible{color:#c1768d!important;background:#fff!important}
a.back:hover .arrow,a.back:hover .arr,a.back:focus-visible .arrow,a.back:focus-visible .arr{transform:translateX(-3px)!important}
a.back:focus-visible{outline:2px solid #892e44!important;outline-offset:3px!important}
@media(max-width:600px){a.back{top:8px!important;left:8px!important;width:32px!important;height:32px!important}}
</style><style>
/* Exact native SVG artwork; no raster downsampling */
.artboard{width:100%!important;max-width:none!important;background-image:url("art-about.svg")!important;background-position:top center!important;background-size:100% 100%!important;background-repeat:no-repeat!important}
</style><meta content="notranslate" name="google"/><style>:root{--page-arrow:#f8f3f1;}</style><style id="arrow-only-refinement">
a.back,a.back:link,a.back:visited{position:fixed!important;z-index:99999!important;top:10px!important;left:15px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;width:40px!important;height:42px!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important;background:transparent!important;text-decoration:none!important;color:var(--page-arrow,#f8f3f1)!important;transition:opacity .22s ease!important}
a.back .arrow,a.back .arr{font:400 34px/1 Arial,Helvetica,sans-serif!important;transition:transform .22s ease!important}
a.back:hover,a.back:focus-visible{background:transparent!important;color:var(--page-arrow,#f8f3f1)!important;opacity:.7!important}
a.back:hover .arrow,a.back:hover .arr,a.back:focus-visible .arrow,a.back:focus-visible .arr{transform:translateX(-4px)!important}
a.back:focus-visible{outline:1px solid currentColor!important;outline-offset:2px!important}
@media(prefers-reduced-motion:reduce){a.back,a.back .arrow,a.back .arr{transition:none!important}}
</style>
<style id="mobile-portfolio-styles">
.mobile-portfolio{display:none}
@media(max-width:700px){
 html,body{max-width:100%;overflow-x:hidden}
 body>:not(.mobile-portfolio):not(script){display:none!important}
 .mobile-portfolio{display:block!important;position:relative;width:100%;max-width:700px;margin:0 auto;line-height:0;background:#892e44}
 .mobile-portfolio .mobile-image{display:block;width:100%;height:auto}
 .mobile-portfolio .mobile-hit{position:absolute;z-index:4;display:block;text-decoration:none;border:0;outline-offset:-3px;-webkit-tap-highlight-color:rgba(255,255,255,.15);border-radius:2px}
 .mobile-portfolio .mobile-hit:focus-visible{outline:2px solid #fff;background:rgba(255,255,255,.12)}
 .mobile-portfolio .mobile-back{position:absolute;z-index:5;top:1%;left:1.7%;display:grid;place-items:center;width:38px;height:38px;line-height:1;color:#f8f3f1;text-decoration:none;font-size:30px;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
 .mobile-portfolio .mobile-back:focus-visible{outline:2px solid currentColor}
}
</style>
</head>
<body>
<div class="mobile-portfolio" aria-label="Mobile portfolio page"><img class="mobile-image" src="about-mobile.png" alt="" aria-hidden="true" width="1080" height="1920" decoding="async"/><a class="mobile-back" aria-label="Back" href="contents.html">←</a></div>
<main><div class="artboard">
<a aria-label="Back to previous portfolio section" class="back" href="contents.html"><span aria-hidden="true" class="arrow">←</span></a>
</div></main>
</body>
</html>
