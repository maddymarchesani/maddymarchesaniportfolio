<!DOCTYPE html>

<html lang="en-AU" translate="no">
<head>
<meta charset="utf-8"/>

<meta content="Explore Maddy Marchesani's fashion design process and collections." name="description"/>
<title>Fashion Design | Maddy Marchesani</title>
<style>
:root{--paper:#f8f3f1;--wine:#8b2e44;--hover:#c46f86}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--wine)}
main{min-height:100svh;display:grid;place-items:center;overflow:hidden}
.artboard{position:relative;width:min(100vw,82.54svh);aspect-ratio:1024.5 / 1241.25;background:var(--paper) url('./fashion-design-original.svg') center / 100% 100% no-repeat}
/* Only the two photographic panels are interactive; the supplied hover SVGs are used unchanged. */
.panel{position:absolute;top:35.85%;height:50.65%;width:50%;display:block;overflow:hidden;outline-offset:-5px;cursor:pointer}
.panel--process{left:0}
.panel--gallery{right:0}
.panel::after{content:"";position:absolute;inset:0;background-position:center;background-size:100% 100%;background-repeat:no-repeat;opacity:0;transition:opacity .24s ease;pointer-events:none}
.panel--process::after{background-image:url('./design-process-hover.webp')}
.panel--gallery::after{background-image:url('./collection-gallery-hover.webp')}
.panel:hover::after,.panel:focus-visible::after{opacity:1}
.panel:focus-visible{outline:3px solid var(--wine)}
.back{position:absolute;left:4.5%;bottom:1.9%;display:inline-flex;align-items:center;gap:.5em;padding:.5em .7em;color:var(--wine);font-size:clamp(9px,1vw,14px);letter-spacing:.10em;text-decoration:none;transition:color .22s ease}
.back .arrow{font-size:1.55em;line-height:.7;transition:transform .22s ease}
.back:hover,.back:focus-visible{color:var(--hover)}
.back:hover .arrow,.back:focus-visible .arrow{transform:translateX(-.22em)}
.back:focus-visible{outline:1px solid currentColor;outline-offset:3px}
@media(max-width:600px){.back{font-size:clamp(8px,1.8vw,11px)}}
@media(prefers-reduced-motion:reduce){.panel::after,.back,.back .arrow{transition:none}}
</style>
<style>
/* 2026 refinement: full-width, native-artwork, consistent navigation */
html,body{width:100%;max-width:100%;margin:0;overflow-x:hidden}
main{width:100%!important;max-width:none!important;min-height:0!important;display:block!important;overflow:visible!important;margin:0 auto!important}
.artboard{width:100%!important;max-width:none!important;margin:0 auto!important;background-repeat:no-repeat!important}
.back,.back:link,.back:visited{position:fixed!important;top:clamp(12px,2vw,28px)!important;left:clamp(12px,2.2vw,30px)!important;bottom:auto!important;right:auto!important;z-index:999!important;display:inline-flex!important;align-items:center!important;gap:9px!important;padding:10px 14px!important;border:1px solid rgba(255,255,255,.32)!important;border-radius:2px!important;background:rgba(110,37,56,.82)!important;color:#fff!important;box-shadow:none!important;backdrop-filter:blur(8px);font:500 12px/1.2 Arial,Helvetica,sans-serif!important;letter-spacing:.14em!important;text-transform:uppercase!important;text-decoration:none!important;transform:none!important;transition:background-color .2s ease,color .2s ease!important}
.back .arrow,.back .arr{font:400 23px/14px Arial,Helvetica,sans-serif!important;display:inline-block!important;transition:transform .2s ease!important}
.back:hover,.back:focus-visible{background:rgba(139,46,68,.98)!important;color:#ffe2e8!important}
.back:hover .arrow,.back:hover .arr,.back:focus-visible .arrow,.back:focus-visible .arr{transform:translateX(-3px)!important}
.back:focus-visible{outline:2px solid currentColor!important;outline-offset:3px!important}
@media(max-width:600px){.back{padding:8px 10px!important;font-size:10px!important;gap:6px!important}}
@media(prefers-reduced-motion:reduce){.back,.back .arrow,.back .arr{transition:none!important}}
</style><style>
.panel{top:37.0%!important;height:51.8%!important;width:50%!important}
.panel--process{left:0!important}.panel--gallery{left:50%!important;right:auto!important}
.panel::after{display:none!important}
.panel::before{content:"";position:absolute;inset:0;background:rgba(139,46,68,.66);opacity:0;transition:opacity .22s ease}
.panel .hover-caption{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;letter-spacing:.12em;font:500 clamp(14px,2.2vw,30px)/1.3 Arial,Helvetica,sans-serif;opacity:0;transition:opacity .22s ease;padding:12px}

/* Consistent compact navigation above the page artwork */

a.back:hover .arrow,a.back:hover .arr,a.back:focus-visible .arrow,a.back:focus-visible .arr{transform:translateX(-3px)!important}
a.back:focus-visible{outline:2px solid #892e44!important;outline-offset:3px!important}

</style><style>

.artboard{width:100%!important;max-width:none!important;background-image:url("art-fashion-design.svg")!important;background-position:top center!important;background-size:100% 100%!important;background-repeat:no-repeat!important}
.panel--process{left:0.0976086%!important;top:37.2224321%!important;width:49.9489080%!important;height:52.2343907%!important;right:auto!important;bottom:auto!important;}

a.back,a.back:link,a.back:visited{position:fixed!important;z-index:99999!important;top:10px!important;left:15px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;width:40px!important;height:42px!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important;background:transparent!important;text-decoration:none!important;color:var(--page-arrow,#f8f3f1)!important;transition:opacity .22s ease!important}
a.back .arrow,a.back .arr{font:400 34px/1 Arial,Helvetica,sans-serif!important;transition:transform .22s ease!important}

a.back:hover .arrow,a.back:hover .arr,a.back:focus-visible .arrow,a.back:focus-visible .arr{transform:translateX(-4px)!important}
a.back:focus-visible{outline:1px solid currentColor!important;outline-offset:2px!important}
